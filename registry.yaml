# CUARTEL — MCP server registry for Anna's forensic tool fleet.
#
# This file is pure metadata. It carries no forensic logic and no decision
# authority of any kind — it only describes how to launch each project's
# OWN, independently-owned MCP server, and what capability plane and
# authority boundary that server operates under.
#
# Every entry is a separate MCP capability plane (see zaynor's
# docs/adr/0001-separate-mcp-capability-planes.md for the precedent this
# registry generalizes). Entries are never merged into a single combined
# server. If a target runtime cannot load multiple MCP servers, the
# documented fallback is a typed multiplexer that preserves these same
# authority boundaries — not a flat proxy. That multiplexer does not exist
# yet; this registry does not build one.
#
# status values:
#   ready    - server exists, verified, safe to register with a client now.
#   blocked  - server exists but has a known open issue; do not register.
#   planned  - server does not exist yet; tracked here for visibility only.

servers:
  vigia:
    display_name: "VIGIA Sift Bridge"
    repo: /home/labestiadevigia/vigia-repo
    command: /home/labestiadevigia/vigia-repo/launch_vigia_mcp.sh
    args: []
    cwd: /home/labestiadevigia/vigia-repo
    env: {}
    # launch_vigia_mcp.sh already exports every env var this server needs
    # (VIGIA_EVIDENCE_DIR, VIGIA_SYSTEM_PROMPT_PATH, VIGIA_HMAC_KEY_FILE,
    # VIGIA_LLM_BACKEND, etc.) and sources vigia-repo/.env itself. Cuartel
    # does not re-declare or override them, to avoid two sources of truth
    # for the same evidence/work directory confinement.
    plane: read-only-evidence-and-analysis
    authority: >-
      No verdict authority over this bridge's own output beyond what
      vigia_agent.py's deterministic core already seals. The LLM narration
      path (reason_with_llm) does not alter sealed values (CLAUDE.md §5.1).
    status: ready
    tool_count: 33
    notes: >-
      stdio-only by design; vigia_sift_bridge.py's
      _verify_transport_security() hard-aborts on any other transport.

  cronos:
    display_name: "CRONOS MCP"
    repo: /home/labestiadevigia/cronos
    command: /home/labestiadevigia/cronos/.venv/bin/python3
    args: ["mcp_server.py"]
    cwd: /home/labestiadevigia/cronos
    env:
      CRONOS_DB_PATH: "/home/labestiadevigia/cronos/cronos.db"
    plane: reasoning-trace-and-audit
    authority: >-
      No authority over any caller's verdict; seals its own trace chain
      (SHA-256 TraceChain) independently of whatever it is recording about.
    status: ready
    tool_count: 10
    notes: >-
      FIXED 2026-10-09: this session's own cronos MCP connection failed
      (CONNECTION_CLOSED) at startup. Root cause verified by reproducing
      it directly: mcp_server.py hard-requires anyio's trio backend
      (`anyio.run(mcp.run_stdio_async, backend="trio")`), and `trio` —
      declared in pyproject.toml — was never installed for the bare
      `python3` the old config pointed at (no venv existed; `pip install
      --user` is blocked here by PEP 668). Fix: created
      cronos/.venv, `pip install -e .` there (pulls mcp + trio), and
      repointed both ~/.claude.json's own mcpServers.cronos entry and
      this registry at .venv/bin/python3. Verified with a real stdio
      handshake after the fix: list_tools returned exactly 10 tools,
      matching zaynor's own allowlist for this same server
      (docs/mcp-locales.md).

  mneme:
    display_name: "MNEME MCP (read-only)"
    repo: /home/labestiadevigia/mneme
    command: /usr/bin/python3
    args: ["mcp_server_readonly.py"]
    cwd: /home/labestiadevigia/mneme
    env:
      MNEME_DB_PATH: "/home/labestiadevigia/mneme/mneme.db"
    plane: case-memory-and-audit
    authority: >-
      No authority; verifies/reads only. Never INSERTs, UPDATEs, grants,
      or quarantines.
    status: ready
    tool_count: 3
    notes: >-
      Built 2026-10-09 (mcp_server_readonly.py, commit 124739e). mneme's
      own mcp_server.py exposes 26 tools, most mutating — NOT registered
      here. This curated file exposes exactly the 3 tools zaynor already
      vetted and allowlisted for read-only use
      (zaynor/docs/adr/0001-separate-mcp-capability-planes.md):
      mneme_info, mneme_verify_bundle, mneme_custody_chain. Implementations
      copied verbatim from the main server, not reimplemented. Uses
      mcp.run() (asyncio default) instead of the main server's forced
      trio backend, since trio is not installed here and none of these
      3 tools needs it.
      Verified with a real stdio handshake (3 tools) and a real call
      against the live mneme.db.

  mneme_memory_mcp:
    display_name: "mneme_memory_mcp (superseded — do not register)"
    repo: /home/labestiadevigia/mneme_memory_mcp
    command: null
    args: []
    cwd: /home/labestiadevigia/mneme_memory_mcp
    env: {}
    plane: case-memory-and-audit
    authority: "N/A — superseded."
    status: planned
    tool_count: 0
    notes: >-
      Investigated 2026-10-09: an earlier, smaller snapshot of the same
      lineage as mneme (9 tools vs. mneme's 26; separate GitHub remote,
      annatchijova/mneme_memory_mcp). mneme is a functional superset.
      Deliberately not built/registered — would be redundant, not a
      second source of truth.

  raven-memory:
    display_name: "raven-memory MCP (read-only)"
    repo: /home/labestiadevigia/raven-memory
    command: /usr/bin/python3
    args: ["mcp_server_readonly.py"]
    cwd: /home/labestiadevigia/raven-memory
    env:
      RAVEN_DB_PATH: "/home/labestiadevigia/raven-memory/raven_memory.db"
    plane: adaptive-memory-audit
    authority: >-
      No authority; reads engine state and the audit chain only.
    status: ready
    tool_count: 6
    notes: >-
      Built 2026-10-09 (mcp_server_readonly.py, commit 64e5256). mneme's
      own README documents fusing STIGMERGY + raven-memory's field
      mechanics, so there is conceptual overlap between this server and
      mneme — registered anyway per explicit request, as a second,
      independent memory system with its own engine and audit chain, not
      a duplicate view of mneme's data.
      mcp_server.py exposes 12 tools; excludes 5 obvious writes (store,
      reinforce, forget, create_link, consolidate) AND raven_recall,
      which looks read-only but calls self._db.store_audit(...) and
      self._db.update_activations(...) on every call (memory_engine.py).
      Keeps: raven_stats, raven_get_memory, raven_audit_trail,
      raven_export_graph, raven_verify_chain, raven_info. Skips
      constructing the Qwen/sentence-transformers embedding provider
      entirely, since none of the six kept tools embeds text.
      Verified with a real stdio handshake (6 tools) and a real call
      against the live raven_memory.db.

  stigmergy:
    display_name: "stigmergy MCP (not built — deep CockroachDB coupling)"
    repo: /home/labestiadevigia/stigmergy
    command: null
    args: []
    cwd: /home/labestiadevigia/stigmergy
    env: {}
    plane: multi-agent-coordination
    authority: "N/A — does not exist."
    status: planned
    tool_count: 0
    notes: >-
      Investigated 2026-10-09, not built: no MCP server exists. CockroachDB
      is not an optional/secondary dependency here — it is the only
      coordination channel between agents AND the primary store: native
      VECTOR column + VECTOR INDEX for recall() (CockroachDB v25.2+
      feature, required by the hackathon this was built for), an authority
      model bound to CockroachDB's own current_user/RBAC
      (ops/authority.py), changefeeds pushing to Lambda, and retry logic
      keyed to CockroachDB's own SQLSTATE 40001. No ORM/repository layer
      exists — raw SQL is spread across 12 files (ops/*.py, audit/*.py,
      lambdas/*.py). Worse for a read-only bridge: recall() itself writes
      (updates access metadata, can trigger a REDISCOVERED state
      transition in the same transaction) — it is not a read despite the
      name.
      Decoupling a read-only path with moderate effort is not realistic.
      If a read-only view is wanted later, the honest path is a periodic
      exporter/snapshot (ETL to SQLite/JSON) built OUTSIDE stigmergy's own
      code, with an MCP bridge over that snapshot — not a live bridge
      against CockroachDB, and not an edit to ops/ or audit/.

  zaynor:
    display_name: "ZAYNOR MCP"
    repo: /home/labestiadevigia/zaynor
    command: /home/labestiadevigia/zaynor/.venv/bin/zaynor-mcp
    args: []
    cwd: /home/labestiadevigia/zaynor
    env: {}
    # ZAYNOR_MCP_STATE_DIR defaults to "state" relative to cwd if unset
    # (src/zaynor/zaynor_mcp_server.py:41) - fine as a default, override
    # here only if a dedicated state dir is ever needed.
    plane: case-memory-and-audit
    authority: >-
      No verdict authority. zaynor_info/verify_audit/verify_memory/
      list_memory/add_hypothesis/note_question never create, modify, or
      recalculate result.json or result.seal.json (ADR-0001).
    status: ready
    tool_count: 6
    notes: >-
      ZAYNOR is itself an MCP client of VIGIA/CRONOS/MNEME (see its own
      docs/mcp-locales.md) — that wiring is internal to zaynor and is not
      duplicated here. Cuartel only registers zaynor's OWN server.

  velo:
    display_name: "VELO MCP"
    repo: /home/labestiadevigia/velo
    command: /usr/bin/node
    args: ["dist/src/mcp/server.js"]
    cwd: /home/labestiadevigia/velo
    env: {}
    plane: zk-attestation
    authority: >-
      No verdict authority over this bridge beyond what the sealed bundle
      already carries; seal_case/verify_case read/write local-cases/ only.
    status: ready
    tool_count: 13
    notes: >-
      UNBLOCKED (2026-10-09): the F1 path-traversal flagged in the original
      Spanish report (velo/docs/informe-red-team-VELO.md) was fixed in
      commit ef0caa4 ("Red team round 1: fix 12 of 13 findings, verified
      against the live code first") — caseId regex at the schema boundary
      (server.ts) + resolve()/prefix check in the store (store.ts). Verified
      here, not assumed: ran velo's own tests/caseid.test.ts live, 4/4 pass,
      including "the store refuses to read or write outside its directory".
      That Spanish report predates 6 further red-team rounds
      (docs/RED_TEAM_ROUND_1..6.md); the remaining open items there (F20-F25)
      are Medium/Low severity and do not touch caseId/MCP path handling —
      out of scope for this registration, not re-audited here.

  annaconda:
    display_name: "annaconda MCP"
    repo: /home/labestiadevigia/annaconda
    command: /usr/bin/python3
    args: ["-m", "service.mcp_server"]
    cwd: /home/labestiadevigia/annaconda
    env:
      ANNACONDA_BASE_URL: "http://127.0.0.1:8080"
    plane: read-only-verdict-query
    authority: >-
      No verdict authority; proxies GET-only routes from the already-running
      annaconda service. Holds no state, reimplements no logic.
    status: ready
    tool_count: 8
    notes: >-
      Built 2026-10-09 (service/mcp_server.py, commit 6507ebb). Thin stdio
      wrapper (stdlib urllib only, no new runtime deps besides `mcp`) over
      a curated GET-only subset of service/app.py: health, registry,
      catalog, hunts, list_cases, get_case, get_case_stix, get_case_cacao.
      Excludes by construction every route that creates a case, starts a
      live investigation, or pushes to an external system (POST /cases,
      /investigate, /cases/{id}/investigate, /fleet-investigate,
      /cases/{id}/push-to-secops, /injection-demo, /tasks/sweep).
      REQUIRES the annaconda service itself to already be running
      (`uvicorn service.app:app --port 8080`) — this bridge holds no case
      data of its own. Verified with a real stdio handshake: list_tools
      returned exactly these 8 tools; a call against a non-annaconda
      service on the configured port returned a graceful error dict
      instead of crashing.

  pancito-red-team:
    display_name: "pancito-red-team MCP"
    repo: /home/labestiadevigia/pancito-red-team
    command: /usr/bin/python3
    args: ["-m", "offensive.mcp_server"]
    cwd: /home/labestiadevigia/pancito-red-team
    env: {}
    plane: passive-local-file-analysis-only
    authority: >-
      No verdict/finding authority on its own; triages/scores receipts the
      caller already produced. Does not execute any network action.
    status: ready
    tool_count: 2
    notes: >-
      Built 2026-10-09 (offensive/mcp_server.py, commit c5a56cc). Exposes
      ONLY pancito_openapi_triage and pancito_purple_evaluate — the two
      passive, no-network CLIs. Every other offensive.*_cli (bola_cli,
      cors_misconfiguration_cli, ssrf_outbound_fetch_cli, etc.) actively
      executes real network actions against a manifest-declared loopback
      target and is deliberately NOT exposed here. Growing this tool list
      requires a separately reviewed authorization/loopback-enforcement
      design at the MCP layer, not an edit to this file.
      Verified with a real stdio handshake (2 tools) and a real end-to-end
      call against hand-built fixtures matching
      tests/test_openapi_cli.py's own expected values byte-for-byte; the
      missing-file error path degrades to an error dict, no crash.

  siberian:
    display_name: "siberian MCP (built, not enabled)"
    repo: /home/labestiadevigia/siberian
    command: /usr/bin/python3
    args: ["-m", "siberian.mcp_server"]
    cwd: /home/labestiadevigia/siberian
    env: {}
    plane: read-only-artifact-matrix
    authority: >-
      No verdict authority; it does not infer deletion or intent — it
      reports declared evidence gaps only (per siberian's own description).
    status: planned
    tool_count: 6
    notes: >-
      Built 2026-10-09 (siberian/mcp_server.py, commit 1b7a232). Exposes 6
      read-only subcommands (validate, analyze, explain, seal, verify,
      rivals) — none writes, mutates, or creates a file. Deliberately
      excludes import-plaso and the Level 6 adapters (optional extras not
      installed, "Partial" per siberian's own Build Levels table).
      Verified with a real stdio handshake (6 tools) and real calls
      against examples/case-mixed-statuses.json.
      Still status: planned ON PURPOSE even though the server works and
      is technically ready: siberian's own README says "UNDER
      CONSTRUCTION — NOT READY FOR OPERATIONAL USE." The server existing
      is not the gate here — siberian's own maturity declaration is. Flip
      to status: ready only when that changes, not when this bridge does.
